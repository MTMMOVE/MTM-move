name: MTMMOVE
options:
  bundleIdPrefix: com.mtmexpress
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "$(APPLE_TEAM_ID)"
targets:
  MTMMOVE:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MTMMOVE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtmexpress.mtm-move
        PRODUCT_NAME: "MTM MOVE"
        INFOPLIST_FILE: MTMMOVE/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALOG: false
    info:
      path: MTMMOVE/Info.plist
